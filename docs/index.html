<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trending Products — Dropship Research</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="header">
      <div class="header-inner">
        <div>
          <h1>🔥 Trending Products</h1>
          <p class="subtitle">Dropshipping Research Dashboard</p>
        </div>
        <div class="header-meta">
          <div class="update-row">
            <span class="label">Last updated:</span>
            <span id="last-updated" class="highlight">Loading…</span>
          </div>
          <div class="source-row" id="source-statuses"></div>
        </div>
      </div>
    </header>

    <main class="container">

      <!-- ── Stats ── -->
      <section class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="stat-total">—</div>
          <div class="stat-label">Trending Products</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-sources">—</div>
          <div class="stat-label">Active Sources</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-multi">—</div>
          <div class="stat-label">Multi-Source Hits</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-top-cat">—</div>
          <div class="stat-label">Top Category</div>
        </div>
      </section>

      <!-- ── Charts ── -->
      <section class="charts-grid">
        <div class="chart-card">
          <h3 class="chart-title">Products by Category</h3>
          <div class="chart-wrap">
            <canvas id="catChart"></canvas>
          </div>
        </div>
        <div class="chart-card">
          <h3 class="chart-title">Products by Source</h3>
          <div class="chart-wrap chart-wrap--donut">
            <canvas id="srcChart"></canvas>
          </div>
        </div>
      </section>

      <!-- ── Filters ── -->
      <section class="filters">
        <div class="filter-row">
          <input id="q" type="search" placeholder="Search products…" class="input-search" />
          <select id="fCat" class="input-select">
            <option value="">All Categories</option>
          </select>
          <select id="fSrc" class="input-select">
            <option value="">All Sources</option>
            <option value="Amazon">Amazon</option>
            <option value="eBay">eBay</option>
            <option value="AliExpress">AliExpress</option>
            <option value="Google Trends">Google Trends</option>
            <option value="Reddit">Reddit</option>
          </select>
          <select id="fSort" class="input-select">
            <option value="score">Sort: Trend Score</option>
            <option value="sources">Sort: Most Sources</option>
            <option value="price_asc">Sort: Price ↑</option>
            <option value="price_desc">Sort: Price ↓</option>
          </select>
        </div>
        <div class="filter-count">
          Showing <strong id="result-count">0</strong> products
        </div>
      </section>

      <!-- ── Product Grid ── -->
      <section class="products-section">
        <div class="products-grid" id="grid">
          <div class="state-msg">Loading trending products…<span class="spinner"></span></div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
